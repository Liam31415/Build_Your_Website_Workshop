<!DOCTYPE html>
<html>
    <head>
        <title>Liam O'Donnell's Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <div id="hero-container">
            <div id="about-container">
                <h1>Hi, my name is Liam O'Donnell</h1>
                <p id="headline-text">
                    I am a freshmen math major at RPI.
                </p>
                <a id="download-button" href="Liam_ODonnell_Resume.pdf">Download Liam_ODonnell_Resume</a>
            </div>
            
            <div id="headshot-container">
                <img id="headshot" alt="Liam ODonnell Headshot" src="Headshot.jpg">
            </div>
        </div>
        
        <div id="skills-container">
            <h2 id="skills-title">Skills</h2>
            <div class="skills-layout">
                <div class="skill-group">
                    <h3 class="group-header">Languages</h3>
                    <ul class="skill-tags">
                        <li>Python</li>
                        <li>Swift</li>
                    </ul>
                </div>
                <div class="skill-group">
                    <h3 class="group-header">Frameworks & Tools</h3>
                    <ul class="skill-tags">
                        <li>GitHub</li>
                    </ul>
                </div>
                <div class="skill-group">
                    <h3 class="group-header">Cloud & Project Management</h3>
                    <ul class="skill-tags">
                        <li>Firebase</li>
                    </ul>
                </div>
            </div>
        </div>
        
        <button id="dark-mode-btn">Toggle Dark Mode</button>
        <script src="script.js"></script>
    </body>
</html>
